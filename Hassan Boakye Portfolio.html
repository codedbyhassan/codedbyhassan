<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hassan Agyemang Boakye — Systems Administrator & Full-Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo+Black&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{min-height:100vh; background:#fff;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  ul{list-style:none;}
  table{border-collapse:collapse; width:100%;}

  /* ====================================================================
     LAYOUT 1 — CLEAN / PROFESSIONAL  (top navbar, corporate two-col hero)
     ==================================================================== */
  .layout-clean{
    --bg:#FFFFFF; --surface:#F6F8FB; --text:#14213D; --muted:#5B6B82;
    --accent:#2E5AAC; --accent2:#1B8A6B; --border:#E1E7EF;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .layout-clean h1,.layout-clean h2,.layout-clean .c-logo{ font-family:'Space Grotesk',sans-serif; }
  .layout-clean .c-nav{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  .layout-clean .c-nav-inner{ max-width:1100px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .layout-clean .c-logo{ font-weight:700; font-size:18px; letter-spacing:-0.02em; }
  .layout-clean .c-links{ display:flex; gap:26px; font-size:14px; font-weight:500; color:var(--muted); }
  .layout-clean .c-links a:hover{ color:var(--accent); }
  .layout-clean .c-switcher{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:4px; }
  .layout-clean .c-switcher button{ font-family:'Inter',sans-serif; font-size:11px; font-weight:600; padding:7px 12px; border:none; background:transparent; color:var(--muted); border-radius:16px; cursor:pointer; }
  .layout-clean .c-switcher button.active{ background:var(--accent); color:#fff; }

  .layout-clean .c-wrap{ max-width:1100px; margin:0 auto; padding:0 28px; }
  .layout-clean .c-hero{ padding:80px 0 60px; }
  .layout-clean .c-hero-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:50px; align-items:start; }
  .layout-clean .c-eyebrow{ font-size:13px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:16px; display:block; }
  .layout-clean .c-hero h1{ font-size:clamp(36px,5vw,56px); font-weight:700; line-height:1.08; margin-bottom:20px; }
  .layout-clean .c-role{ font-size:17px; line-height:1.7; color:var(--muted); margin-bottom:26px; max-width:560px; }
  .layout-clean .c-badges{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:30px; }
  .layout-clean .c-badge{ font-size:12.5px; font-weight:500; padding:6px 13px; border-radius:20px; background:var(--surface); border:1px solid var(--border); color:var(--muted); }
  .layout-clean .c-cta{ display:flex; gap:12px; }
  .layout-clean .c-btn{ font-size:14px; font-weight:600; padding:12px 22px; border-radius:10px; background:var(--text); color:#fff; }
  .layout-clean .c-btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .layout-clean .c-hero-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px; }
  .layout-clean .c-card-row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .layout-clean .c-card-row:last-child{ border-bottom:none; }
  .layout-clean .c-card-row span{ color:var(--muted); }
  .layout-clean .c-card-row strong{ font-weight:600; }

  .layout-clean section{ padding:64px 0; border-top:1px solid var(--border); }
  .layout-clean section > .c-wrap > h2{ font-size:28px; font-weight:700; margin-bottom:36px; }
  .layout-clean .c-about-cols{ display:grid; grid-template-columns:1.4fr 1fr; gap:40px; }
  .layout-clean .c-about-text p{ font-size:15.5px; line-height:1.8; color:var(--muted); margin-bottom:14px; }
  .layout-clean .c-stats{ display:flex; flex-direction:column; gap:12px; }
  .layout-clean .c-stat{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .layout-clean .c-stat .num{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--accent); }
  .layout-clean .c-stat .label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }

  .layout-clean .c-project-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .layout-clean .c-project{ border:1px solid var(--border); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:12px; transition:box-shadow 200ms, transform 200ms; }
  .layout-clean .c-project:hover{ box-shadow:0 10px 26px rgba(20,33,61,0.08); transform:translateY(-3px); }
  .layout-clean .c-project h3{ font-size:16.5px; font-weight:700; }
  .layout-clean .c-project p{ font-size:13.5px; color:var(--muted); line-height:1.6; flex-grow:1; }
  .layout-clean .c-stack{ font-size:11.5px; color:var(--accent2); font-weight:600; }
  .layout-clean .c-plinks{ display:flex; gap:14px; font-size:12.5px; font-weight:600; }
  .layout-clean .c-plinks a{ color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

  .layout-clean .c-timeline{ position:relative; padding-left:28px; }
  .layout-clean .c-timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .layout-clean .c-titem{ position:relative; padding-bottom:34px; }
  .layout-clean .c-titem::before{ content:""; position:absolute; left:-28px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:3px solid var(--bg); box-shadow:0 0 0 2px var(--accent); }
  .layout-clean .c-titem .date{ font-size:12px; font-weight:600; color:var(--accent); text-transform:uppercase; margin-bottom:4px; }
  .layout-clean .c-titem h3{ font-size:17px; font-weight:700; }
  .layout-clean .c-titem .org{ font-size:13px; color:var(--muted); margin-bottom:8px; display:block; }
  .layout-clean .c-titem li{ font-size:13.5px; color:var(--muted); line-height:1.65; padding-left:14px; position:relative; margin-bottom:4px;}
  .layout-clean .c-titem li::before{ content:"–"; position:absolute; left:0; }

  .layout-clean .c-skill-rows{ display:flex; flex-direction:column; gap:18px; }
  .layout-clean .c-skill-row{ display:flex; gap:20px; align-items:baseline; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--border); }
  .layout-clean .c-skill-row .cat{ font-size:13px; font-weight:700; color:var(--text); width:190px; flex-shrink:0; }
  .layout-clean .c-skill-row .items{ font-size:14px; color:var(--muted); }

  .layout-clean footer{ padding:60px 0; text-align:center; border-top:1px solid var(--border); }
  .layout-clean footer h2{ font-size:30px; font-weight:700; margin-bottom:20px; }
  .layout-clean .c-fbtn{ display:inline-block; font-size:14px; font-weight:600; padding:13px 26px; border-radius:10px; background:var(--text); color:#fff; margin-bottom:24px; }
  .layout-clean .c-flinks{ display:flex; gap:20px; justify-content:center; font-size:13.5px; color:var(--muted); }
  .layout-clean .c-flinks a:hover{ color:var(--accent); }

  @media(max-width:820px){
    .layout-clean .c-hero-grid, .layout-clean .c-about-cols{ grid-template-columns:1fr; }
    .layout-clean .c-project-grid{ grid-template-columns:1fr; }
    .layout-clean .c-links{ display:none; }
  }

  /* ====================================================================
     LAYOUT 2 — CYBERPUNK  (fixed left HUD sidebar, terminal windows)
     ==================================================================== */
  .layout-cyberpunk{
    --bg:#06010F; --panel:#0F0620; --panel2:#170A30; --text:#E9E4FF; --muted:#9C8FC9;
    --accent:#FF2ED1; --accent2:#00F0FF; --border:#3A1D63;
    background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace;
    position:relative; min-height:100vh;
  }
  .layout-cyberpunk::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
  }
  .layout-cyberpunk .cy-sidebar{
    position:fixed; top:0; left:0; bottom:0; width:250px; background:var(--panel);
    border-right:1px solid var(--border); padding:26px 20px; display:flex; flex-direction:column; gap:26px; overflow-y:auto; z-index:10;
  }
  .layout-cyberpunk .cy-ascii{ font-size:13px; font-weight:800; color:var(--accent); text-shadow:0 0 8px var(--accent); letter-spacing:0.05em; }
  .layout-cyberpunk .cy-status{ font-size:10.5px; color:var(--accent2); margin-top:6px; }
  .layout-cyberpunk .cy-nav{ display:flex; flex-direction:column; gap:10px; }
  .layout-cyberpunk .cy-nav a{ font-size:12px; color:var(--muted); }
  .layout-cyberpunk .cy-nav a:hover{ color:var(--accent2); }
  .layout-cyberpunk .cy-switcher{ display:flex; flex-direction:column; gap:6px; }
  .layout-cyberpunk .cy-switcher .lbl{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:2px; }
  .layout-cyberpunk .cy-switcher button{ font-family:'JetBrains Mono',monospace; text-align:left; font-size:11.5px; padding:7px 9px; background:transparent; border:1px solid var(--border); color:var(--muted); cursor:pointer; }
  .layout-cyberpunk .cy-switcher button.active{ border-color:var(--accent); color:var(--accent); box-shadow:0 0 10px rgba(255,46,209,0.4); }
  .layout-cyberpunk .cy-stats{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }
  .layout-cyberpunk .cy-stat{ border:1px solid var(--border); padding:8px 10px; }
  .layout-cyberpunk .cy-stat .num{ font-size:18px; font-weight:800; color:var(--accent2); }
  .layout-cyberpunk .cy-stat .label{ font-size:9.5px; color:var(--muted); text-transform:uppercase; }

  .layout-cyberpunk .cy-main{ margin-left:250px; padding:36px 40px 60px; max-width:900px; }
  .layout-cyberpunk .cy-window{ border:1px solid var(--border); background:var(--panel2); margin-bottom:24px; }
  .layout-cyberpunk .cy-titlebar{ display:flex; gap:6px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); }
  .layout-cyberpunk .cy-titlebar span{ width:8px; height:8px; border-radius:50%; background:var(--border); display:inline-block; }
  .layout-cyberpunk .cy-titlebar span:nth-child(1){ background:#FF5F56; }
  .layout-cyberpunk .cy-titlebar span:nth-child(2){ background:#FFBD2E; }
  .layout-cyberpunk .cy-titlebar span:nth-child(3){ background:#27C93F; }
  .layout-cyberpunk .cy-window-body{ padding:22px 24px; }
  .layout-cyberpunk .cy-prompt{ font-size:12px; color:var(--accent2); margin-bottom:10px; }
  .layout-cyberpunk .cy-window-body h1{ font-size:clamp(26px,4vw,38px); color:var(--text); text-shadow:0 0 2px var(--accent2),2px 0 var(--accent),-2px 0 var(--accent2); margin-bottom:14px; line-height:1.15; }
  .layout-cyberpunk .cy-role{ font-size:13.5px; color:var(--muted); line-height:1.75; margin-bottom:20px; }
  .layout-cyberpunk .cy-badges{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .layout-cyberpunk .cy-badge{ font-size:11px; border:1px solid var(--accent2); color:var(--accent2); padding:5px 10px; }
  .layout-cyberpunk .cy-cta{ display:flex; gap:12px; }
  .layout-cyberpunk .cy-btn{ font-size:12px; font-weight:700; padding:11px 18px; background:var(--accent); color:#06010F; box-shadow:0 0 16px rgba(255,46,209,0.5); }
  .layout-cyberpunk .cy-btn.ghost{ background:transparent; color:var(--accent2); border:1px solid var(--accent2); box-shadow:0 0 10px rgba(0,240,255,0.3); }

  .layout-cyberpunk .cy-window-body p.plain{ font-size:13px; color:var(--muted); line-height:1.85; margin-bottom:12px; }
  .layout-cyberpunk .cy-table th{ text-align:left; font-size:10.5px; color:var(--accent2); text-transform:uppercase; padding:6px 10px; border-bottom:1px solid var(--border); }
  .layout-cyberpunk .cy-table td{ font-size:12px; padding:10px; border-bottom:1px solid var(--border); vertical-align:top; color:var(--muted); }
  .layout-cyberpunk .cy-table td.name{ color:var(--text); font-weight:700; }
  .layout-cyberpunk .cy-table a{ color:var(--accent); text-decoration:underline; }

  .layout-cyberpunk .cy-log{ margin-bottom:18px; }
  .layout-cyberpunk .cy-log .ts{ color:var(--accent2); font-size:11px; }
  .layout-cyberpunk .cy-log h3{ font-size:14.5px; color:var(--text); margin:4px 0 2px; }
  .layout-cyberpunk .cy-log .org{ font-size:11.5px; color:var(--accent); display:block; margin-bottom:8px; }
  .layout-cyberpunk .cy-log li{ font-size:12px; color:var(--muted); padding-left:14px; position:relative; margin-bottom:4px; line-height:1.6; }
  .layout-cyberpunk .cy-log li::before{ content:">"; position:absolute; left:0; color:var(--accent2); }

  .layout-cyberpunk .cy-skillgroup{ margin-bottom:16px; }
  .layout-cyberpunk .cy-skillgroup .lbl{ font-size:11px; color:var(--accent2); text-transform:uppercase; margin-bottom:8px; }
  .layout-cyberpunk .cy-chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .layout-cyberpunk .cy-chip{ font-size:11px; border:1px solid var(--border); padding:5px 10px; color:var(--text); }

  .layout-cyberpunk .cy-footer .cy-window-body a{ color:var(--accent); text-decoration:underline; }
  .layout-cyberpunk .cy-footer .cy-window-body div{ font-size:12.5px; color:var(--muted); margin-bottom:8px; }

  @media(max-width:820px){
    .layout-cyberpunk .cy-sidebar{ position:static; width:auto; }
    .layout-cyberpunk .cy-main{ margin-left:0; padding:24px; }
  }

  /* ====================================================================
     LAYOUT 3 — BRUTALIST  (stacked poster/zine, no persistent nav)
     ==================================================================== */
  .layout-brutalist{
    --bg:#F2F0EA; --surface:#FFFFFF; --yellow:#FFE600; --text:#0A0A0A; --muted:#3A3A3A;
    --accent:#FF3300; --border:#0A0A0A;
    background:var(--bg); color:var(--text); font-family:'IBM Plex Mono',monospace;
  }
  .layout-brutalist .br-topbar{ display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:3px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; }
  .layout-brutalist .br-issue{ font-weight:700; font-size:13px; }
  .layout-brutalist .br-switcher{ display:flex; gap:8px; }
  .layout-brutalist .br-switcher button{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; padding:8px 12px; border:2px solid var(--border); background:var(--surface); cursor:pointer; box-shadow:3px 3px 0 var(--border); }
  .layout-brutalist .br-switcher button.active{ background:var(--yellow); }
  .layout-brutalist .br-switcher button:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--border); }

  .layout-brutalist .br-wrap{ max-width:1000px; margin:0 auto; padding:0 24px; }
  .layout-brutalist .br-hero{ padding:70px 24px 50px; border-bottom:3px solid var(--border); }
  .layout-brutalist .br-giant{ font-family:'Archivo Black',sans-serif; font-size:clamp(42px,9vw,100px); line-height:0.92; text-transform:uppercase; max-width:1000px; margin:0 auto 26px; }
  .layout-brutalist .br-hero-meta{ max-width:1000px; margin:0 auto 20px; display:flex; gap:10px; flex-wrap:wrap; }
  .layout-brutalist .br-stamp{ background:var(--yellow); border:2px solid var(--border); padding:5px 12px; font-size:11.5px; font-weight:700; text-transform:uppercase; transform:rotate(-1.5deg); display:inline-block; }
  .layout-brutalist .br-role{ max-width:640px; margin:0 auto 22px; font-size:16px; line-height:1.6; }
  .layout-brutalist .br-badges{ max-width:1000px; margin:0 auto 26px; display:flex; flex-wrap:wrap; gap:8px; }
  .layout-brutalist .br-badge{ border:2px solid var(--border); padding:5px 11px; font-size:11.5px; background:var(--surface); box-shadow:3px 3px 0 var(--border); }
  .layout-brutalist .br-cta{ max-width:1000px; margin:0 auto; display:flex; gap:14px; }
  .layout-brutalist .br-btn{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; padding:13px 24px; border:3px solid var(--border); background:var(--text); color:var(--bg); box-shadow:5px 5px 0 var(--accent); }
  .layout-brutalist .br-btn.ghost{ background:var(--surface); color:var(--text); }
  .layout-brutalist .br-btn:hover{ transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--accent); }

  .layout-brutalist .br-marker{ display:inline-block; font-family:'Archivo Black',sans-serif; font-size:13px; text-transform:uppercase; background:var(--text); color:var(--bg); padding:6px 14px; margin-bottom:26px; }

  .layout-brutalist .br-about{ padding:60px 0; border-bottom:3px solid var(--border); }
  .layout-brutalist .br-row{ display:grid; grid-template-columns:0.9fr 1.6fr; gap:30px; }
  .layout-brutalist .br-about-text p{ font-size:15px; line-height:1.75; margin-bottom:14px; }
  .layout-brutalist .br-stat-strip{ display:flex; gap:0; margin-top:36px; border:3px solid var(--border); }
  .layout-brutalist .br-stat{ flex:1; padding:20px; border-right:3px solid var(--border); }
  .layout-brutalist .br-stat:last-child{ border-right:none; }
  .layout-brutalist .br-stat .num{ font-family:'Archivo Black',sans-serif; font-size:36px; color:var(--accent); }
  .layout-brutalist .br-stat .label{ font-size:11px; text-transform:uppercase; margin-top:4px; }

  .layout-brutalist .br-projects{ padding:60px 0; border-bottom:3px solid var(--border); }
  .layout-brutalist .br-prow{ border:3px solid var(--border); background:var(--surface); margin-bottom:22px; padding:26px; display:grid; grid-template-columns:90px 1fr; gap:22px; }
  .layout-brutalist .br-prow:nth-child(even){ background:var(--yellow); }
  .layout-brutalist .br-prow .idx{ font-family:'Archivo Black',sans-serif; font-size:44px; line-height:1; }
  .layout-brutalist .br-prow h3{ font-size:20px; text-transform:uppercase; margin-bottom:8px; }
  .layout-brutalist .br-prow p{ font-size:13.5px; line-height:1.65; margin-bottom:10px; }
  .layout-brutalist .br-prow .stack{ font-size:11px; font-weight:700; margin-bottom:10px; }
  .layout-brutalist .br-prow .links{ display:flex; gap:14px; font-size:12px; font-weight:700; }
  .layout-brutalist .br-prow .links a{ text-decoration:underline; }

  .layout-brutalist .br-exp{ padding:60px 0; border-bottom:3px solid var(--border); }
  .layout-brutalist .br-ecard{ border:3px solid var(--border); background:var(--surface); padding:22px; margin-bottom:20px; box-shadow:6px 6px 0 var(--border); }
  .layout-brutalist .br-ecard .date{ font-size:11px; font-weight:700; background:var(--text); color:var(--bg); display:inline-block; padding:3px 9px; margin-bottom:10px; }
  .layout-brutalist .br-ecard h3{ font-size:18px; text-transform:uppercase; }
  .layout-brutalist .br-ecard .org{ font-size:12.5px; color:var(--accent); font-weight:700; display:block; margin-bottom:10px; }
  .layout-brutalist .br-ecard li{ font-size:13px; line-height:1.65; padding-left:16px; position:relative; margin-bottom:5px; }
  .layout-brutalist .br-ecard li::before{ content:"■"; position:absolute; left:0; font-size:8px; top:5px; }

  .layout-brutalist .br-skills{ padding:60px 0; border-bottom:3px solid var(--border); }
  .layout-brutalist .br-skill-cloud{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .layout-brutalist .br-word{ font-family:'Archivo Black',sans-serif; text-transform:uppercase; border:2px solid var(--border); padding:6px 14px; background:var(--surface); }
  .layout-brutalist .br-word.lg{ font-size:22px; background:var(--yellow); }
  .layout-brutalist .br-word.md{ font-size:16px; }
  .layout-brutalist .br-word.sm{ font-size:13px; color:var(--muted); }

  .layout-brutalist footer{ padding:70px 24px; }
  .layout-brutalist footer h2{ font-family:'Archivo Black',sans-serif; font-size:clamp(28px,5vw,50px); text-transform:uppercase; margin-bottom:24px; max-width:900px; margin-left:auto; margin-right:auto; text-align:center;}
  .layout-brutalist .br-fbtn{ display:block; width:fit-content; margin:0 auto 26px; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; padding:14px 28px; border:3px solid var(--border); background:var(--accent); color:#fff; box-shadow:5px 5px 0 var(--border); }
  .layout-brutalist .br-flinks{ display:flex; gap:20px; justify-content:center; font-size:13px; font-weight:700; flex-wrap:wrap; }
  .layout-brutalist .br-flinks a{ text-decoration:underline; }

  @media(max-width:820px){
    .layout-brutalist .br-row{ grid-template-columns:1fr; }

      <a class="br-fbtn" href="mailto:${DATA.email}">${DATA.email}</a>
      <div class="br-flinks">
        <a href="${DATA.github}" target="_blank" rel="noopener">GITHUB</a>
        <a href="${DATA.linkedin}" target="_blank" rel="noopener">LINKEDIN</a>
        <a href="tel:${DATA.phone.replace(/\s/g,'')}">${DATA.phone}</a>
      </div>
    </footer>
  </div>`;
}

/* ============================ RENDER: MINIMALIST ============================ */
function renderMinimalist(active){
  const prows = DATA.projects.map((p,i) => `
    <tr>
      <td class="idx">${String(i+1).padStart(2,'0')}</td>
      <td>${p.title}<div class="muted" style="margin-top:4px;">${p.desc}</div></td>
      <td class="stack">${p.stack}</td>
      <td>${p.source ? `<a href="${p.source}" target="_blank" rel="noopener">Source</a>` : `<span class="muted">Private</span>`}${p.demo ? ` / <a href="${p.demo}" target="_blank" rel="noopener">Demo</a>` : ``}</td>
    </tr>`).join("");

  const exprows = DATA.experience.map(e => `
    <div class="mn-exp-row">
      <div class="yr">${e.date}</div>
      <div>
        <h3>${e.title}</h3>
        <span class="org">${e.org}</span>
        <ul>${e.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>
      </div>
    </div>`).join("");

  const skillCats = Object.entries(DATA.skills).map(([cat,items]) => `
    <div class="mn-skill-cat">
      <div class="lbl">${cat}</div>
      <ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>
    </div>`).join("");

  return `
  <div class="layout-minimalist">
    <aside class="mn-sidebar">
      <div>
        <div class="mn-name">${DATA.name}</div>
        <div class="mn-role-small">${DATA.roleShort}</div>
      </div>
      <nav class="mn-nav">
        <a href="#mn-about">01 — About</a>
        <a href="#mn-projects">02 — Work</a>
        <a href="#mn-exp">03 — Experience</a>
        <a href="#mn-skills">04 — Skills</a>
        <a href="#mn-contact">05 — Contact</a>
      </nav>
      <div class="mn-switcher">${switcherBtns(active)}</div>
      <div class="mn-contact-mini">
        <div><a href="mailto:${DATA.email}">${DATA.email}</a></div>
        <div>${DATA.phone}</div>
        <div>${DATA.location}</div>
      </div>
    </aside>

    <main class="mn-main">
      <section class="mn-hero">
        <h1>${DATA.roleLong.replace('React, Supabase, and Node.js', '<span class="hl">React, Supabase, and Node.js</span>')}</h1>
      </section>

      <section id="mn-about" class="mn-section">
        <div class="mn-label">01 — About</div>
        <div class="mn-grid-2">
          <div></div>
          <div>${DATA.about.map(p=>`<p>${p}</p>`).join("")}</div>
        </div>
        <div class="mn-stat-table">${DATA.stats.map(s=>`<div><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join("")}</div>
      </section>

      <section id="mn-projects" class="mn-section">
        <div class="mn-label">02 — Selected Work</div>
        <table class="mn-table">
          <thead><tr><th>Idx</th><th>Project</th><th>Stack</th><th>Link</th></tr></thead>
          <tbody>${prows}</tbody>
        </table>
      </section>

      <section id="mn-exp" class="mn-section">
        <div class="mn-label">03 — Experience</div>
        ${exprows}
      </section>

      <section id="mn-skills" class="mn-section">
        <div class="mn-label">04 — Skills</div>
        <div class="mn-skills-grid">${skillCats}</div>
      </section>

      <footer id="mn-contact" class="mn-section mn-footer">
        <div class="mn-label">05 — Contact</div>
        <div class="big">Let's build something that ships.</div>
        <a class="email" href="mailto:${DATA.email}">${DATA.email}</a>
        <div class="meta">
          ${DATA.phone} — ${DATA.location}<br>
          <a href="${DATA.github}" target="_blank" rel="noopener">${DATA.githubLabel}</a> ·
          <a href="${DATA.linkedin}" target="_blank" rel="noopener">${DATA.linkedinLabel}</a>
        </div>
      </footer>
    </main>
  </div>`;
}

/* ============================ SWITCH LOGIC ============================ */
const renderers = { clean:renderClean, cyberpunk:renderCyberpunk, brutalist:renderBrutalist, minimalist:renderMinimalist };

function setTheme(name){
  document.getElementById('app').innerHTML = renderers[name](name);
  document.body.style.background = getComputedStyle(document.querySelector('.layout-'+name)).backgroundColor;
  window.scrollTo(0,0);
}

setTheme('clean');
</script>
</body>
</html>
